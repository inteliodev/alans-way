<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src ws: wss:; object-src 'none'; base-uri 'none'">
<title>VPS computer</title><link rel="stylesheet" href="remote.css"><link rel="stylesheet" href="theme-light.css"></head><body>
<div class="remote-head"><div class="remote-name"><span id="connection-dot"></span><span id="remote-name">VPS computer</span></div><div class="remote-actions"><button id="control" title="Enable mouse and keyboard input">Take control</button><button id="paste" title="Paste Mac clipboard into the VPS" aria-label="Paste Mac clipboard into the VPS">Paste</button></div></div>
<div id="screen"></div><div id="remote-empty"><div class="computer-mark">▣</div><h2 id="remote-title">Your agent’s computer</h2><p id="remote-message">Connect your VPS to see its desktop here.</p><button id="configure">Connect VPS</button></div>
<form id="credentials" class="hidden"><label for="vnc-password">VNC password</label><input id="vnc-password" type="password" autocomplete="off"><button type="submit">Connect</button></form>
<div id="remote-hint" class="remote-hint">Watching · use the top-right button to expand</div><script type="module" src="remote.js"></script></body></html>
