[Service]
# Optional hermes-gateway drop-in. The plugin reads ~/.config/intelio/pwa.env
# when INTELIO_FILLER_URL is unset, and uses https when that file sets both
# INTELIO_PWA_CERT and INTELIO_PWA_KEY. Uncomment to pin the URL, using the
# INTELIO_PWA_BIND host. Then daemon-reload and restart hermes-gateway.
# Environment=INTELIO_FILLER_URL=https://intelio-vps.tail9c1007.ts.net:8643
