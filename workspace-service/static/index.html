<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intelio workspace</title>
<link rel="stylesheet" href="static/vendor/xterm.css">
<link rel="stylesheet" href="static/app.css">
<script>
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo">◆</span> intelio workspace</div>
    <button id="newTaskBtn" class="btn primary block">＋ New task</button>
    <div class="section-title">Automations</div>
    <div class="muted small pad">No automations yet.</div>
    <div class="section-title">Runtime</div>
    <div class="pad small"><a href="#" id="statusLink">Hermes builder · models &amp; helpers</a></div>
    <div id="taskList"></div>
  </aside>
  <main id="center">
    <div id="empty" class="empty">
      <h2>Cloud agents on your VPS</h2>
      <p class="muted">Each task gets its own git worktree and branch. Engines never push — you review the changes and push from here.</p>
      <button class="btn primary" onclick="openNewTask()">＋ New task</button>
    </div>
    <div id="taskView" hidden>
      <header class="task-head">
        <div class="title-wrap">
          <div id="taskTitle" class="task-title"></div>
          <div id="taskMeta" class="muted small"></div>
        </div>
        <div class="head-actions">
          <span id="taskStatus" class="pill"></span>
          <button id="markDoneBtn" class="btn ghost small">Mark done</button>
        </div>
      </header>
      <div id="conversation"></div>
      <div id="changesCard" class="card" hidden></div>
      <form id="composer">
        <textarea id="composerText" rows="2" placeholder="Send a follow-up…"></textarea>
        <div class="composer-row">
          <select id="modelSelect" title="Hermes model"></select>
          <span id="helperChips" class="small muted"></span>
          <span class="spacer"></span>
          <button type="button" id="stopBtn" class="btn danger small" hidden>■ Stop</button>
          <button type="submit" id="sendBtn" class="btn primary small">Send</button>
        </div>
      </form>
    </div>
  </main>
  <section id="right" hidden>
    <div class="pr-head">
      <div class="branch-line"><span class="icon-branch"></span> <code id="prBranch"></code> <span class="muted">→</span> <code id="prBase"></code></div>
      <div class="pr-actions">
        <a id="prLink" target="_blank" rel="noopener" hidden></a>
        <span id="prState" class="pill" hidden></span>
        <button id="commitBtn" class="btn small">Commit all</button>
        <button id="pushBtn" class="btn small">Push</button>
        <button id="openPrBtn" class="btn small">Open draft PR</button>
        <button id="readyBtn" class="btn small" hidden>Mark as ready</button>
        <button id="mergeBtn" class="btn small danger" hidden title="Needs your approval">Merge to main…</button>
      </div>
    </div>
    <nav class="tabs">
      <button data-tab="changes" class="active">Changes</button>
      <button data-tab="desktop">Desktop</button>
      <button data-tab="terminal">Terminal</button>
      <button data-tab="files">Files</button>
    </nav>
    <div class="tab-body">
      <div id="tab-changes" class="tab active"></div>
      <div id="tab-desktop" class="tab"></div>
      <div id="tab-terminal" class="tab">
        <div class="proc-bar"><span class="muted small">Windows:</span> <span id="procList"></span><span class="spacer"></span><button id="termReconnect" class="btn ghost small">Reconnect</button></div>
        <div id="term"></div>
      </div>
      <div id="tab-files" class="tab">
        <div class="files-split"><div id="fileTree"></div><div id="fileView"><div class="muted pad">Select a file.</div></div></div>
      </div>
    </div>
  </section>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast" hidden></div>

<script src="static/vendor/xterm.js"></script>
<script src="static/vendor/addon-fit.js"></script>
<script src="static/app.js"></script>
</body>
</html>
