name: windows-installer

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/intelio-harness-layer-8db4
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and build the per-user installer
        run: |
          npm ci
          npm run package:win
      - name: Smoke-test the packaged app
        timeout-minutes: 3
        run: |
          $exe = Join-Path $pwd "dist\win-unpacked\Intelio.exe"
          if (-not (Test-Path $exe)) { throw "packaged exe missing: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($null -eq $p.ExitCode -or $p.ExitCode -ne 0) { throw "smoke exit $($p.ExitCode)" }
      - name: End-to-end main window against a fake Hermes
        timeout-minutes: 8
        run: |
          node scripts/packaged-window-e2e.cjs
      - name: Upload the e2e screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelio-e2e-main-window
          path: desktop/dist/e2e-*.png
          if-no-files-found: ignore
      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: Intelio-Setup
          path: desktop/dist/Intelio-Setup-*.exe
          if-no-files-found: error
      - name: Attach a private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.3.6-intelio-windows"
          fi
          NOTES="Unsigned per-user Intelio installer (NSIS, x64). Private draft only — do not publish this release. Windows SmartScreen: More info, then Run anyway. See docs/intelio-windows-and-mobile.md."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Intelio-Setup-*.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/Intelio-Setup-*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Intelio Windows $TAG" \
              --notes "$NOTES"
          fi
