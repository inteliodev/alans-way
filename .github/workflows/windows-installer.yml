name: windows-installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and build the per-user installer
        run: |
          npm ci
          npm run package:win
      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: Intelio-Setup
          path: desktop/dist/Intelio-Setup-*.exe
          if-no-files-found: error
      - name: Attach a private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="windows-build-${GITHUB_SHA::12}"
          fi
          NOTES="Unsigned per-user Intelio installer (NSIS, x64). Private draft only — do not publish this release. Windows SmartScreen: More info, then Run anyway. See docs/intelio-windows-and-mobile.md."
          gh release create "$TAG" dist/Intelio-Setup-*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Intelio Windows $TAG" \
            --notes "$NOTES"
