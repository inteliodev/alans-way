name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

  package-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel in a fresh environment
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv "$RUNNER_TEMP/companion-venv"
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/companion-venv/bin/python" -m pip install 'mcp==2.0.0'
          python -c 'import os; from pathlib import Path; p = Path(os.environ["GITHUB_PATH"]); p.open("a").write(os.environ["RUNNER_TEMP"] + "/companion-venv/bin\n")'
      - name: Exercise installed CLI and real local protocol
        run: python scripts/smoke_installed.py
      - name: Test installed package
        run: |
          python -m pip install 'PyYAML>=6' 'pytest>=8'
          python -m unittest discover -s tests -v
          python -m pytest --rootdir intelio/vendor/intelio-harness intelio/vendor/intelio-harness/tests
      - name: Publication safety checks
        run: python scripts/check_publication.py
